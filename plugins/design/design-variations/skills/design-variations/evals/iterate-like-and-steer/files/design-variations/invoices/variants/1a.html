<style>
main{padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
.head{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.head h1{margin:0;font-size:var(--text-2xl);letter-spacing:-.02em;flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4);display:flex;flex-direction:column;gap:2px}
.stat span{color:var(--text-3);font-size:var(--text-sm)}
.stat b{font:600 var(--text-xl)/1.2 var(--font-mono);font-variant-numeric:tabular-nums;margin-top:4px}
.stat small{color:var(--text-3);font-size:var(--text-xs)}
.stat.alert{border-color:#efc4c4;background:linear-gradient(var(--surface),var(--surface)) padding-box}
.stat.alert span{color:var(--overdue);font-weight:600}
.stat.alert b{color:var(--overdue);font-size:24px}
.stat .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stat .see{all:unset;cursor:pointer;color:var(--overdue);font-weight:600;font-size:var(--text-xs);text-decoration:underline;text-underline-offset:3px}
.stat .see:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.bar{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--radius-sm);overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:5px;font:500 var(--text-sm)/1 var(--font-sans);color:var(--text-2);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab .n{color:var(--text-2);font-variant-numeric:tabular-nums}
.tab .n.hot{color:var(--overdue);font-weight:700}
.bar .k-search{flex:1;min-width:220px}
.bulk{display:none;gap:var(--space-3);align-items:center;background:var(--text);color:#fff;padding:8px 8px 8px 14px;border-radius:var(--radius);flex-wrap:wrap}
.bulk.on{display:flex}
.bulk .k-btn{background:transparent;color:#fff;border-color:#ffffff59}
.bulk .k-btn:hover{background:#ffffff1a}
.bulk .sum{color:#c9d3ce;font-family:var(--font-mono);font-size:var(--text-sm)}
.bulk .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 320px);min-height:260px}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
thead th{position:sticky;top:0;z-index:1;background:var(--surface);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);font-weight:600;box-shadow:inset 0 -1px 0 var(--border)}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;border-radius:4px}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
th button .k-ico{opacity:.35;width:13px;height:13px}
th[aria-sort=ascending] button,th[aria-sort=descending] button{color:var(--text)}
th[aria-sort=ascending] button .k-ico,th[aria-sort=descending] button .k-ico{opacity:1}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.inv{font-family:var(--font-mono);font-size:var(--text-sm)}
td.client{font-weight:500;max-width:280px}
td.num,th.num{text-align:right}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr.overdue td.num{font-weight:600}
tr.paid td,tr.draft td{color:var(--text-2)}
.when{display:flex;flex-direction:column;line-height:1.3}
.when small{font-size:var(--text-xs)}
.acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.acts .remind{visibility:hidden}
tr:hover .acts .remind,tr:focus-within .acts .remind,tr.overdue .acts .remind{visibility:visible}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){main{padding:var(--space-4)}.head h1{flex-basis:100%}.card{max-height:none}.bar .k-search{min-width:100%}}
</style>
<div class="k-app" id="app">
  <div class="k-top-wrap"></div>
  <main>
    <div class="head"><h1>Invoices</h1>
      <button class="k-btn" id="export" type="button"></button>
      <button class="k-btn primary" id="new" type="button"></button></div>
    <section class="stats" aria-label="Summary" id="stats"></section>
    <div class="bar"><div class="tabs" role="group" aria-label="Filter by status" id="tabs"></div>
      <label class="k-search"><span id="sicon"></span><span class="k-sr">Search invoices</span><input id="q" type="search" placeholder="Search client or invoice #"></label></div>
    <div class="bulk" id="bulk" role="region" aria-label="Bulk actions"><strong id="bulk-n"></strong><span class="sum" id="bulk-sum"></span><span class="sp"></span>
      <button class="k-btn sm" id="remind" type="button">Send reminders</button><button class="k-btn sm" id="markpaid" type="button">Mark paid</button><button class="k-btn sm" id="clear" type="button">Clear</button></div>
    <div class="card" id="card"><table><thead><tr id="th"></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden></div></div>
  </main>
</div>
<script>
(function(){
const K=KIT,S=K.createStore(),$=s=>document.querySelector(s),f=K.fmt;
const app=$('#app');
app.insertAdjacentHTML('afterbegin',K.shell());
$('.k-top-wrap').outerHTML=K.topbar();
document.querySelector('.k-app').style.gridTemplateRows='auto';
K.bindShell(document.body);
$('#export').innerHTML=K.icon('download')+'Export CSV';$('#new').innerHTML=K.icon('plus')+'New invoice';$('#sicon').innerHTML=K.icon('search');
let st={tab:'all',q:'',sort:{k:'issued',dir:-1}};
const COLS=[['no','Invoice'],['client','Client'],['issued','Issued'],['due','Due'],[null,'Status'],['amount','Amount','num']];
function view(){return S.view(st)}
function render(){K.keepFocus(document.body,()=>{
  const t=S.totals(),late=S.data.filter(r=>r.status==='overdue'),oldest=late.reduce((m,r)=>Math.max(m,K.daysLate(r)),0);
  $('#stats').innerHTML=
   `<div class="stat"><span>Outstanding</span><b>${f.money(t.outstanding)}</b><small>${S.count('due')+S.count('overdue')} unpaid invoices</small></div>`+
   `<div class="stat alert"><span>Overdue</span><b>${f.money(t.overdue)}</b><span class="row"><small>${late.length} invoices${late.length?' · oldest '+oldest+' days late':''}</small>${late.length?'<button type="button" class="see" data-focus="see-over" id="see-over">Show overdue</button>':''}</span></div>`+
   `<div class="stat"><span>Paid this month</span><b>${f.money(t.paid)}</b><small>${S.count('paid')} invoices</small></div>`+
   `<div class="stat"><span>Drafts</span><b>${t.drafts}</b><small>Not sent yet</small></div>`;
  $('#tabs').innerHTML=K.TABS.map(([k,l])=>`<button type="button" class="tab" aria-pressed="${st.tab===k}" data-t="${k}" data-focus="tab-${k}">${l} <span class="n${k==='overdue'&&S.count(k)?' hot':''}">${S.count(k)}</span></button>`).join('');
  $('#th').innerHTML=`<th style="width:44px"><input type="checkbox" class="k-check" id="all" aria-label="Select all shown invoices"></th>`+COLS.map(([k,l,c])=>k?`<th class="${c||''}" aria-sort="${st.sort.k===k?(st.sort.dir>0?'ascending':'descending'):'none'}"><button type="button" data-k="${k}" data-focus="sort-${k}">${l}${K.icon(st.sort.k===k&&st.sort.dir>0?'up':'down')}</button></th>`:`<th>${l}</th>`).join('')+`<th><span class="k-sr">Actions</span></th>`;
  const v=view();
  $('#rows').innerHTML=v.map(r=>{const tm=f.timing(r),cls=r.status==='overdue'?'k-late':(r.status==='due'&&K.daysFromToday(r.due)<=7?'k-soon':'');
   return `<tr class="${r.status}${S.sel.has(r.no)?' sel':''}"><td><input type="checkbox" class="k-check" data-s="${r.no}" data-focus="s-${r.no}" ${S.sel.has(r.no)?'checked':''} aria-label="Select ${r.no}"></td>
   <td class="inv">${r.no}</td><td class="client">${f.esc(r.client)}</td><td>${f.date(r.issued)}</td>
   <td><span class="when">${f.date(r.due)}${r.status==='due'||r.status==='overdue'?`<small class="${cls}">${tm}</small>`:''}</span></td>
   <td><span class="k-pill ${r.status}">${f.status(r.status)}</span></td><td class="num">${f.money(r.amount)}</td>
   <td><div class="acts">${r.status==='due'||r.status==='overdue'?`<button type="button" class="k-btn sm remind" data-remind="${r.no}" data-focus="r-${r.no}" aria-label="Send reminder for ${r.no}">${K.icon('mail')}Remind</button>`:''}
   <button type="button" class="k-btn icon sm" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for ${r.no}" data-m="${r.no}" data-focus="m-${r.no}">${K.icon('more')}</button></div></td></tr>`}).join('');
  const e=$('#empty');e.hidden=v.length>0;e.innerHTML=v.length?'':K.emptyHTML(S);
  $('#all').checked=v.length>0&&v.every(r=>S.sel.has(r.no));
  const sel=[...S.sel].map(S.find).filter(Boolean);
  $('#bulk').classList.toggle('on',sel.length>0);$('#bulk-n').textContent=sel.length+' selected';$('#bulk-sum').textContent=f.money(sel.reduce((a,r)=>a+r.amount,0));
})}
S.on(render);
document.addEventListener('click',e=>{const b=e.target.closest('button,input');if(!b)return;
 if(b.dataset.t){st.tab=b.dataset.t;render()}
 if(b.id==='see-over'){st.tab='overdue';render();$('#card').scrollIntoView({block:'nearest'})}
 if(b.dataset.k){st.sort={k:b.dataset.k,dir:st.sort.k===b.dataset.k?-st.sort.dir:1};render()}
 if(b.dataset.s){b.checked?S.sel.add(b.dataset.s):S.sel.delete(b.dataset.s);render()}
 if(b.id==='all'){view().forEach(r=>b.checked?S.sel.add(r.no):S.sel.delete(r.no));render()}
 if(b.dataset.m){K.menu(b,K.rowItems(S,S.find(b.dataset.m)))}
 if(b.dataset.remind){K.act(S,'remind',b.dataset.remind)}
 if(b.id==='remind'){K.act(S,'remind',[...S.sel])} if(b.id==='markpaid'){K.act(S,'paid',[...S.sel])} if(b.id==='clear'){S.sel.clear();render()}
 if(b.hasAttribute('data-k-reset')){st.tab='all';st.q='';$('#q').value='';render()}
 if(b.id==='export')K.toast('Exported '+view().length+' rows');
 if(b.id==='new'||b.hasAttribute('data-k-new'))K.openInvoiceForm(S);
});
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
render();
})();
</script>
