<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0f766e}a:hover{color:#0b5f58}
</style>
</helmet>
<div style="width: 100%; min-height: 100%; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 16px; background: #f7f8f6; color: #14201b; font-family: ui-sans-serif, system-ui, sans-serif;">
  <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
    <h1 style="margin: 0; font-size: 26px; letter-spacing: -0.02em; flex-grow: 1;">Tasks</h1>
    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px;">New task
      <input type="text" value="{{ draft }}" onInput="{{ typeDraft }}" style="padding: 9px 12px; border: 1px solid #cfd5ce; border-radius: 6px; font: inherit; min-height: 40px;">
    </label>
    <button type="button" onClick="{{ add }}" style="align-self: flex-end; min-height: 40px; padding: 0 14px; border: 0; border-radius: 6px; background: #0f766e; color: #ffffff; font-weight: 600;">Add task</button>
  </div>
  <div style="display: flex; gap: 6px;" role="group" aria-label="Show">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
      <button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.on }}" style="{{ f.style }}">{{ f.label }}</button>
    </sc-for>
  </div>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; background: #e2e6e1; border: 1px solid #e2e6e1; border-radius: 10px; overflow: hidden;">
      <sc-for list="{{ rows }}" as="t" hint-placeholder-count="4">
        <li style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: #ffffff;">
          <input type="checkbox" checked="{{ t.done }}" onChange="{{ t.toggle }}" aria-label="{{ t.aria }}">
          <span style="flex-grow: 1; font-size: 14px;">{{ t.title }}</span>
          <span style="font-size: 12px; color: #6a756f;">{{ t.due }}</span>
        </li>
      </sc-for>
    </ul>
  <p style="margin: 0; font-size: 13px; color: #46524c;" aria-live="polite">{{ status }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":520}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', show: 'all', tasks: [
      { id: 1, title: 'Send March invoices to Northwind Bakery', due: 'Today', done: false },
      { id: 2, title: 'Reconcile Atlas Robotics payment', due: 'Tomorrow', done: false },
      { id: 3, title: 'Update VAT number for Fernhill Studio', due: 'Fri', done: true },
      { id: 4, title: 'Chase Quayside Dental overdue balance', due: 'Mon', done: false }
    ] };
  }
  renderVals() {
    const s = this.state;
    const shown = s.tasks.filter((t) => s.show === 'all' || (s.show === 'open' ? !t.done : t.done));
    const pill = (on) => 'min-height: 36px; padding: 0 12px; border-radius: 999px; font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; border: 1px solid ' + (on ? '#0f766e' : '#cfd5ce') + '; background: ' + (on ? '#e3f2ef' : '#ffffff') + '; color: ' + (on ? '#0b5f58' : '#46524c') + ';';
    return {
      draft: s.draft,
      typeDraft: (e) => this.setState({ draft: e.target.value }),
      add: () => {
        const title = s.draft.trim();
        if (!title) { this.setState({ note: 'Type a task first.' }); return; }
        this.setState({ draft: '', note: 'Added “' + title + '”.', tasks: [{ id: Date.now(), title, due: 'No date', done: false }, ...s.tasks] });
      },
      filters: [['all', 'All'], ['open', 'Open'], ['done', 'Done']].map(([k, label]) => ({
        label, on: s.show === k, style: pill(s.show === k), pick: () => this.setState({ show: k })
      })),
      rows: shown.map((t) => ({
        ...t,
        aria: 'Mark “' + t.title + '” ' + (t.done ? 'not done' : 'done'),
        toggle: () => this.setState({ tasks: s.tasks.map((x) => x.id === t.id ? { ...x, done: !x.done } : x) })
      })),
      status: s.note || (shown.length + ' of ' + s.tasks.length + ' tasks shown')
    };
  }
}
</script>
</body>
</html>
